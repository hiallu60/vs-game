services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [backend]
    mem_limit: 512m
    cpus: 0.75
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set a stable random COOKIE_SECRET of at least 32 characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    volumes: [uploads:/app/uploads]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [backend]
    mem_limit: 384m
    cpus: 0.5
    logging: *logging
  web:
    build: ./frontend
    restart: unless-stopped
    ports: ['${WEB_PORT:-80}:80']
    depends_on:
      api: {condition: service_healthy}
    networks: [backend]
    mem_limit: 64m
    cpus: 0.25
    logging: *logging
volumes:
  mysql_data:
  uploads:
networks:
  backend:
    driver: bridge

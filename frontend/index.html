<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VS — 취향이 갈리는 순간</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><a class="logo" href="#">VS<span>밸런스 게임</span></a><button id="new-topic" class="primary">+ 주제 만들기</button></header>
<main id="main" tabindex="-1"></main>
<footer>정답은 없어도, 취향은 있으니까. <b>VS</b><span>로그인 없이 참여하는 익명 밸런스 게임</span></footer>
<dialog id="create-dialog" aria-labelledby="create-title"><form id="create-form">
<div class="dialog-head"><span class="eyebrow">CREATE A DILEMMA</span><button type="button" id="close-dialog" class="icon" aria-label="닫기">✕</button></div>
<h2 id="create-title">어떤 선택이 더 끌리나요?</h2><p class="muted">두 가지 선택지를 적고, 모두의 취향을 확인해 보세요.</p>
<label>주제 제목<input name="title" maxlength="200" required placeholder="예: 평생 하나만 먹을 수 있다면?"></label>
<div class="form-options"><section><span class="badge a">A</span><label>첫 번째 선택지<input name="option_a" maxlength="255" required placeholder="평생 치킨만 먹기"></label><label class="file">이미지 첨부 · 선택<input type="file" name="image_a" accept="image/jpeg,image/png,image/webp"></label></section><section><span class="badge b">B</span><label>두 번째 선택지<input name="option_b" maxlength="255" required placeholder="평생 피자만 먹기"></label><label class="file">이미지 첨부 · 선택<input type="file" name="image_b" accept="image/jpeg,image/png,image/webp"></label></section></div>
<p class="muted small">이미지는 JPG·PNG·WebP, 각 5MB까지 첨부할 수 있어요.</p><p id="create-error" class="error" role="alert"></p><button class="primary wide" type="submit">주제 공개하기 ↗</button>
</form></dialog><div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
